<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Surface Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f9f9fb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 90vw;
      height: 85vh;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
    }
    .info-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      padding: 12px;
      background: #ffffff;
      border-top: 1px solid #f0f0f0;
      border-bottom: 1px solid #f0f0f0;
    }
    .info-item {
      text-align: center;
    }
    .info-label {
      font-size: 11px;
      color: #888;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .info-val {
      font-size: 16px;
      font-weight: bold;
      color: #222;
    }
    /* 関数選択ドロップダウン */
    select.func-select {
      font-size: 15px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background-color: #f8f9fa;
      cursor: pointer;
    }
    .control-panel {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      padding: 12px;
      background: #ffffff;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .control-label {
      font-size: 14px;
      color: #444;
      font-weight: 500;
    }
    input[type="range"] {
      width: 120px;
      accent-color: #222;
    }
    .num-box {
      background: #f4f4f6;
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #222;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
  </style>

  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="container">
  <div id="canvas-container"></div>

  <!-- 情報表示 & 関数選択バー -->
  <div class="info-bar">
    <div class="info-item">
      <div class="info-label">FUNCTION</div>
      <select id="func-select" class="func-select">
        <option value="f1">z = x² + y²</option>
        <option value="f2">z = x⁴ + y⁴ - 2(x-y)²</option>
        <option value="f3">z = (y - x²)(y - 2x²)</option>
      </select>
    </div>
    <div style="width: 1px; height: 24px; background: #eee;"></div>
    <div class="info-item">
      <div class="info-label">GRID</div>
      <div class="info-val" id="grid-display">30 × 30</div>
    </div>
  </div>

  <!-- コントロールパネル -->
  <div class="control-panel">
    <div class="control-group">
      <span class="control-label">Grid Resolution</span>
      <input type="range" id="resolution-slider" min="10" max="80" value="30">
      <span class="num-box" id="res-val-box">30</span>
    </div>

    <div class="control-group">
      <span class="control-label">Show Wireframe</span>
      <label class="switch">
        <input type="checkbox" id="wireframe-toggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<script>
  const container = document.getElementById('canvas-container');
  let scene, camera, renderer, controls;
  let mesh, wireframeMesh;

  // 各関数のパラメータ定義
  const functions = {
    f1: {
      calc: (x, y) => x*x + y*y,
      domainX: [-2, 2],
      domainY: [-2, 2],
      yMin: 0, yMax: 8
    },
    f2: {
      calc: (x, y) => Math.pow(x, 4) + Math.pow(y, 4) - 2 * Math.pow(x - y, 2),
      domainX: [-1.8, 1.8],
      domainY: [-1.8, 1.8],
      yMin: -2, yMax: 12
    },
    f3: {
      calc: (x, y) => (y - x*x) * (y - 2*x*x),
      domainX: [-1.3, 1.3],
      domainY: [-0.3, 1.8],
      yMin: -0.5, yMax: 4
    }
  };

  let currentFuncKey = 'f1';

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(4, 5, 6);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    addHelperElements();
    updateSurface();

    window.addEventListener('resize', onWindowResize);
    setupUIListeners();

    animate();
  }

  function addHelperElements() {
    const axesHelper = new THREE.AxesHelper(2.5);
    scene.add(axesHelper);

    const gridHelper = new THREE.GridHelper(4, 10, 0xdddddd, 0xeeeeee);
    gridHelper.position.y = -1.5;
    scene.add(gridHelper);

    // 原点ラベル
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.font = 'Bold 28px sans-serif';
    ctx.fillStyle = '#ff8c00';
    ctx.fillText('(0,0,0)', 10, 40);
    
    const texture = new THREE.CanvasTexture(canvas);
    const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
    const sprite = new THREE.Sprite(spriteMaterial);
    sprite.position.set(0.2, 0.3, 0);
    sprite.scale.set(1.2, 0.6, 1);
    scene.add(sprite);
  }

  function buildSurface(funcKey, segments, showWireframe) {
    if (mesh) scene.remove(mesh);
    if (wireframeMesh) scene.remove(wireframeMesh);

    const config = functions[funcKey];
    const width = config.domainX[1] - config.domainX[0];
    const height = config.domainY[1] - config.domainY[0];

    const geometry = new THREE.PlaneGeometry(width, height, segments, segments);
    geometry.rotateX(-Math.PI / 2);

    const pos = geometry.attributes.position;
    const count = pos.count;
    const colors = [];

    const xCenter = (config.domainX[0] + config.domainX[1]) / 2;
    const yCenter = (config.domainY[0] + config.domainY[1]) / 2;

    for (let i = 0; i < count; i++) {
      // メッシュのローカル座標から実際の (x, y) 座標へ変換
      const xVal = pos.getX(i) + xCenter;
      const yVal = pos.getZ(i) + yCenter;
      
      const zVal = config.calc(xVal, yVal);
      pos.setY(i, zVal);

      // カラーマッピング (HSL)
      const normalized = (zVal - config.yMin) / (config.yMax - config.yMin);
      const hue = (1 - Math.max(0, Math.min(1, normalized))) * 0.7; // 青〜赤
      const color = new THREE.Color();
      color.setHSL(hue, 1.0, 0.5);

      colors.push(color.r, color.g, color.b);
    }

    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geometry.computeVertexNormals();

    const material = new THREE.MeshPhongMaterial({
      vertexColors: true,
      side: THREE.DoubleSide,
      shininess: 40
    });

    mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    if (showWireframe) {
      const wireMaterial = new THREE.MeshBasicMaterial({
        color: 0x333333,
        wireframe: true,
        transparent: true,
        opacity: 0.3
      });
      wireframeMesh = new THREE.Mesh(geometry, wireMaterial);
      scene.add(wireframeMesh);
    }
  }

  function updateSurface() {
    const slider = document.getElementById('resolution-slider');
    const toggle = document.getElementById('wireframe-toggle');
    const segments = parseInt(slider.value);
    buildSurface(currentFuncKey, segments, toggle.checked);
  }

  function setupUIListeners() {
    const slider = document.getElementById('resolution-slider');
    const resBox = document.getElementById('res-val-box');
    const gridDisplay = document.getElementById('grid-display');
    const toggle = document.getElementById('wireframe-toggle');
    const select = document.getElementById('func-select');

    slider.addEventListener('input', () => {
      const val = slider.value;
      resBox.textContent = val;
      gridDisplay.textContent = `${val} × ${val}`;
      updateSurface();
    });

    toggle.addEventListener('change', updateSurface);

    select.addEventListener('change', (e) => {
      currentFuncKey = e.target.value;
      updateSurface();
    });
  }

  function onWindowResize() {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  init();
</script>

</body>
</html>
